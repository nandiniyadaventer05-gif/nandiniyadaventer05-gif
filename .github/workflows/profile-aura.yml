name: Generate README

on:
  push:
    branches: [ main, master ]
  schedule:
    # Run every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Clone Profile Aura Repository
        run: git clone https://github.com/kalashmishra21/profile-aura.git /tmp/profile-aura
        
      - name: Install Profile Aura Dependencies & Build Framework
        run: |
          cd /tmp/profile-aura
          npm ci
          npm run build
        
      - name: Generate Profile README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: nandiniyadaventer05-gif
        run: node /tmp/profile-aura/dist/cli/index.js build
        
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/generated/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Update README with latest stats [skip ci]" && git push)
